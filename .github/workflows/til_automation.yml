name: TIL PDF Automation

on:
  push:
    branches:
      - main
    paths:
      - 'Computer-science/**/*.pdf'
      - 'Data-structure-and-algorithm/**/*.pdf'
      - 'System-design/**/*.pdf'

permissions:
  contents: write

jobs:
  update-til:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.10'

      - name: Run automation script
        run: |
          if [ "${{ github.event.before }}" = "0000000000000000000000000000000000000000" ]; then
            FILES=$(git ls-tree -r --name-only HEAD | grep '\.pdf$' || true)
          else
            FILES=$(git diff --name-only ${{ github.event.before }} ${{ github.sha }} | grep '\.pdf$' || true)
          fi
          
          if [ -n "$FILES" ]; then
            echo "$FILES" | xargs python .github/scripts/update_til.py
          else
            echo "No PDF files to update."
          fi

      - name: Commit and Push changes
        run: |
          git config --global user.name "github-actions[bot]"
          git config --global user.email "github-actions[bot]@users.noreply.github.com"
          
          git add README.md
          
          if ! git diff-index --quiet HEAD; then
            git commit -m "docs: Auto-update README.md for TIL ($(date +'%Y-%m-%d'))"
            git push
          else
            echo "No changes to commit"
          fi